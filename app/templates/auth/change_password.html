{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="panel">
      <h2 class="mb-3">Change Password</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="current_password">Current password</label>
        <div class="input-group mb-3">
          <input class="form-control" id="current_password" type="password" name="current_password" autocomplete="current-password" data-password-toggle required>
          <button class="btn btn-outline-secondary" type="button" data-password-toggle-button aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <label class="form-label" for="new_password">New password</label>
        <div class="input-group mb-3">
          <input class="form-control" id="new_password" type="password" name="new_password" minlength="4" autocomplete="new-password" data-password-toggle required>
          <button class="btn btn-outline-secondary" type="button" data-password-toggle-button aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <div class="input-group mb-3">
          <input class="form-control" id="confirm_password" type="password" name="confirm_password" minlength="4" autocomplete="new-password" data-password-toggle required>
          <button class="btn btn-outline-secondary" type="button" data-password-toggle-button aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <div class="form-text mb-3">Use at least 4 characters.</div>
        <button class="btn btn-primary">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
