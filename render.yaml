services:
  - type: web
    name: future-tech-innovision-2026
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile - run:app
    healthCheckPath: /healthz
    disk:
      name: future-tech-uploads
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: future-tech-innovision-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: TASK_EMAIL_SMTP_HOST
        sync: false
      - key: TASK_EMAIL_SMTP_PORT
        value: "587"
      - key: TASK_EMAIL_SMTP_USERNAME
        sync: false
      - key: TASK_EMAIL_SMTP_PASSWORD
        sync: false
      - key: TASK_EMAIL_FROM
        value: future-techclub@orchidengg.ac.in

databases:
  - name: future-tech-innovision-db
    databaseName: future_tech_innovision
    user: future_tech_app
    plan: basic-256mb
