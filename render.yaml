services:
  - type: web
    name: future-tech-innovision-2026
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: future-tech-uploads
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: future-tech-innovision-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: ONLYOFFICE_SERVER_URL
        fromService:
          type: web
          name: future-tech-onlyoffice
          property: host
      - key: ONLYOFFICE_JWT_SECRET
        fromService:
          type: web
          name: future-tech-onlyoffice
          envVarKey: JWT_SECRET
      - key: TASK_EMAIL_SMTP_HOST
        sync: false
      - key: TASK_EMAIL_SMTP_PORT
        value: "587"
      - key: TASK_EMAIL_SMTP_USERNAME
        sync: false
      - key: TASK_EMAIL_SMTP_PASSWORD
        sync: false
      - key: TASK_EMAIL_FROM
        value: future-techclub@orchidengg.ac.in

  - type: web
    name: future-tech-onlyoffice
    runtime: image
    image:
      url: docker.io/onlyoffice/documentserver:latest
    plan: 2c-4g
    healthCheckPath: /healthcheck
    envVars:
      - key: JWT_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: future-tech-innovision-db
    databaseName: future_tech_innovision
    user: future_tech_app
    plan: basic-256mb
